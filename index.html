<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Marella Loyalty</title>
  <style>
    body{
      font-family: Tahoma, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:#1e293b;
      padding:30px;
      border-radius:12px;
      text-align:center;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,.4);
    }
    button{
      background:#22c55e;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      color:black;
      font-size:16px;
      cursor:pointer;
    }
    .msg{margin-top:15px;font-size:15px;}
  </style>
</head>
<body>
  <div class="card">
    <h2>برنامج الولاء</h2>
    <p>اضغط لتسجيل زيارتك</p>
    <button onclick="visit()">تسجيل الزيارة</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    let id = localStorage.getItem("client_id");
    if(!id){
      id = Math.random().toString(36).substring(2);
      localStorage.setItem("client_id", id);
    }

    function visit(){
      fetch("https://marella-loyalty.onrender.com/visit/" + id)
      .then(res => res.json())
      .then(data => {
        if(data.code){
          document.getElementById("msg").innerHTML =
            data.msg + "<br>🎟 كودك: <b>"+data.code+"</b>";
        }else{
          document.getElementById("msg").innerText =
            data.msg + " — باقي " + data.left + " زيارات";
        }
      })
      .catch(()=>{
        document.getElementById("msg").innerText = "⚠️ في مشكلة في الاتصال بالسيرفر";
      });
    }
  </script>
</body>
</html>
